[package]
name = "Rust_Projects"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_projects"
path = "src/lib.rs"

[[bin]]
name = "Rust_Projects"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
proptest = "1"
